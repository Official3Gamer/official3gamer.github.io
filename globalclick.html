<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Click Counter</title>
</head>
<body>

    <h1>Global Click Counter</h1>
    
    <p>Total clicks worldwide: <strong id="click-count">Loading...</strong></p>
    
    <button id="click-btn">Click Me!</button>

    <script>

        const WORKSPACE = "NoNamo-Global-Counter";
        const COUNTER_NAME = "global-button-clicks";

        const countElement = document.getElementById('click-count');
        const clickButton = document.getElementById('click-btn');

        // 1. Get the current count when the page loads
        async function getCount() {
            try {
                const response = await fetch(`https://abacus.jasoncameron.dev/get/${WORKSPACE}/${COUNTER_NAME}`);
                const data = await response.json();
                countElement.innerText = data.value;
            } catch (error) {
                console.error("Error loading count:", error);
                countElement.innerText = "Error";
            }
        }

        // 2. Increment the count when the button is clicked
        async function incrementCount() {
            // Disable button briefly to prevent glitchy double-clicks
            clickButton.disabled = true; 
            
            try {
                const response = await fetch(`https://abacus.jasoncameron.dev/hit/${WORKSPACE}/${COUNTER_NAME}`);
                const data = await response.json();
                countElement.innerText = data.value;
            } catch (error) {
                console.error("Error updating count:", error);
            } finally {
                clickButton.disabled = false;
            }
        }

        // Run getCount right when the page opens
        window.addEventListener('DOMContentLoaded', getCount);

        // Run incrementCount when clicked
        clickButton.addEventListener('click', incrementCount);
    </script>

</body>
</html>

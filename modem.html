<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSK / RTTY Encoder & Decoder</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #ffffff;
            color: #000000;
        }
        .section {
            border: 1px solid #777;
            padding: 15px;
            margin-bottom: 20px;
        }
        label {
            display: inline-block;
            margin-top: 8px;
            font-weight: bold;
        }
        input, select, textarea, button {
            margin-top: 4px;
            margin-bottom: 10px;
            display: block;
        }
        textarea {
            width: 100%;
            height: 70px;
        }
        .inline-group {
            display: flex;
            gap: 15px;
        }
        .inline-group div {
            flex: 1;
        }
        .inline-group input {
            width: 100%;
        }
        .output-box {
            border: 1px dashed #555;
            padding: 10px;
            background: #f9f9f9;
            font-family: monospace;
            white-space: pre-wrap;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <h1>FSK & RTTY Audio Encoder / Decoder</h1>

    <div class="section">
        <h2>1. Tone Parameters</h2>
        <label for="fskPreset">Preset Mode:</label>
        <select id="fskPreset" onchange="applyPreset()">
            <option value="bell103">Bell 103 (300 Baud - 1070/1270 Hz)</option>
            <option value="bell202">Bell 202 / APRS (1200 Baud - 1200/2200 Hz)</option>
            <option value="rtty">Amateur RTTY (45.45 Baud - 2125/2295 Hz)</option>
            <option value="v23">ITU V.23 / Caller ID (1200 Baud - 1300/2100 Hz)</option>
            <option value="custom">Custom Configuration</option>
        </select>

        <div class="inline-group">
            <div>
                <label for="markFreq">Mark Frequency (Hz):</label>
                <input type="number" id="markFreq" value="1270">
            </div>
            <div>
                <label for="spaceFreq">Space Frequency (Hz):</label>
                <input type="number" id="spaceFreq" value="1070">
            </div>
            <div>
                <label for="baudRate">Baud Rate (Bits/sec):</label>
                <input type="number" id="baudRate" value="300" step="0.01">
            </div>
        </div>
    </div>

    <div class="section">
        <h2>2. Encode Text to Audio</h2>
        <label for="textInput">Enter Text:</label>
        <textarea id="textInput" placeholder="Type text here to encode..."></textarea>
        <button onclick="generateFromText()">Generate Audio Tones</button>
        
        <br>
        <audio id="textAudioPlayer" controls></audio>
        <br>
        <a id="textDownloadLink" style="display:none;" download="fsk_text_signal.wav">Download WAV File</a>
    </div>

    <div class="section">
        <h2>3. Encode Any File to FSK Audio</h2>
        <label for="fileInput">Select File:</label>
        <input type="file" id="fileInput">
        <button onclick="generateFromFile()">Convert File to FSK Audio</button>
        
        <br>
        <audio id="fileAudioPlayer" controls></audio>
        <br>
        <a id="fileDownloadLink" style="display:none;" download="fsk_file_signal.wav">Download WAV File</a>
    </div>

    <div class="section">
        <h2>4. Decode FSK Audio to Text</h2>
        <label for="audioFileInput">Select WAV Audio File to Decode:</label>
        <input type="file" id="audioFileInput" accept="audio/*">
        <button onclick="decodeAudio()">Decode Tone File</button>

        <label>Decoded Output:</label>
        <div id="decodedOutput" class="output-box">No output yet...</div>
    </div>

    <script>
        const PRESETS = {
            bell103: { mark: 1270, space: 1070, baud: 300 },
            bell202: { mark: 1200, space: 2200, baud: 1200 },
            rtty:    { mark: 2125, space: 2295, baud: 45.45 },
            v23:     { mark: 1300, space: 2100, baud: 1200 }
        };

        const SAMPLE_RATE = 44100;

        function applyPreset() {
            const presetKey = document.getElementById('fskPreset').value;
            if (presetKey !== 'custom') {
                const p = PRESETS[presetKey];
                document.getElementById('markFreq').value = p.mark;
                document.getElementById('spaceFreq').value = p.space;
                document.getElementById('baudRate').value = p.baud;
            }
        }

        function getParams() {
            return {
                markFreq: parseFloat(document.getElementById('markFreq').value),
                spaceFreq: parseFloat(document.getElementById('spaceFreq').value),
                baud: parseFloat(document.getElementById('baudRate').value)
            };
        }

        function bytesToBits(uint8Array) {
            let bits = [];
            for (let i = 0; i < uint8Array.length; i++) {
                let byte = uint8Array[i];
                // 1 Start bit (0/Space), 8 Data bits (LSB first), 1 Stop bit (1/Mark)
                bits.push(0);
                for (let b = 0; b < 8; b++) {
                    bits.push((byte >> b) & 1);
                }
                bits.push(1);
            }
            return bits;
        }

        function synthesizeAudioBuffer(bits, params) {
            const bitDuration = 1 / params.baud;
            const samplesPerBit = Math.floor(SAMPLE_RATE * bitDuration);
            const totalSamples = bits.length * samplesPerBit;

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
            const buffer = audioCtx.createBuffer(1, totalSamples, SAMPLE_RATE);
            const channel = buffer.getChannelData(0);

            let phase = 0;
            let sampleIdx = 0;

            for (let b = 0; b < bits.length; b++) {
                const freq = (bits[b] === 1) ? params.markFreq : params.spaceFreq;
                const phaseInc = (2 * Math.PI * freq) / SAMPLE_RATE;

                for (let s = 0; s < samplesPerBit; s++) {
                    channel[sampleIdx++] = Math.sin(phase);
                    phase += phaseInc;
                }
            }
            return buffer;
        }

        function generateFromText() {
            const text = document.getElementById('textInput').value;
            if (!text) return alert("Please enter text first.");

            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            const bits = bytesToBits(bytes);
            const params = getParams();

            const audioBuffer = synthesizeAudioBuffer(bits, params);
            bindAudioToUI(audioBuffer, 'textAudioPlayer', 'textDownloadLink');
        }

        function generateFromFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert("Please select a file.");

            const reader = new FileReader();
            reader.onload = function(e) {
                const bytes = new Uint8Array(e.target.result);
                const bits = bytesToBits(bytes);
                const params = getParams();

                const audioBuffer = synthesizeAudioBuffer(bits, params);
                bindAudioToUI(audioBuffer, 'fileAudioPlayer', 'fileDownloadLink');
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        function bindAudioToUI(buffer, playerId, linkId) {
            const wavBlob = bufferToWave(buffer, buffer.length);
            const url = URL.createObjectURL(wavBlob);

            const player = document.getElementById(playerId);
            player.src = url;

            const link = document.getElementById(linkId);
            link.href = url;
            link.style.display = "inline";
            link.innerText = "Download Audio (.wav)";
        }

        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
                length = len * numOfChan * 2 + 44,
                out = new DataView(new ArrayBuffer(length)),
                channels = [], i, sample, offset = 0, pos = 0;

            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952);                         // "RIFF"
            setUint32(length - 8);                         // file length - 8
            setUint32(0x45564157);                         // "WAVE"
            setUint32(0x20746d66);                         // "fmt " chunk
            setUint32(16);                                 // length = 16
            setUint16(1);                                  // PCM
            setUint16(numOfChan);
            setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan); // avg. bytes/sec
            setUint16(numOfChan * 2);                      // block-align
            setUint16(16);                                 // 16-bit
            setUint32(0x61746164);                         // "data" chunk
            setUint32(length - pos - 4);                   // chunk length

            for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while(offset < len) {
                for(i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    out.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([out], {type: "audio/wav"});
        }

        async function decodeAudio() {
            const fileInput = document.getElementById('audioFileInput');
            const outputDiv = document.getElementById('decodedOutput');
            
            if (!fileInput.files.length) return alert("Select an audio file first.");

            outputDiv.innerText = "Analyzing audio tones...";

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const rawData = audioBuffer.getChannelData(0);
            const params = getParams();

            const samplesPerBit = Math.floor(SAMPLE_RATE / params.baud);
            let bits = [];

            // Simple Zero-Crossing Frequency Measurement Window
            for (let i = 0; i < rawData.length; i += samplesPerBit) {
                let zeroCrossings = 0;
                for (let j = i; j < i + samplesPerBit && j < rawData.length - 1; j++) {
                    if ((rawData[j] >= 0 && rawData[j + 1] < 0) || (rawData[j] < 0 && rawData[j + 1] >= 0)) {
                        zeroCrossings++;
                    }
                }
                
                let estimatedFreq = (zeroCrossings * SAMPLE_RATE) / (2 * samplesPerBit);
                let distToMark = Math.abs(estimatedFreq - params.markFreq);
                let distToSpace = Math.abs(estimatedFreq - params.spaceFreq);

                bits.push(distToMark < distToSpace ? 1 : 0);
            }

            // Extract 8-N-1 Framed Bytes
            let decodedBytes = [];
            let idx = 0;
            while (idx < bits.length) {
                if (bits[idx] === 0) { // Start bit found
                    let byteVal = 0;
                    for (let b = 0; b < 8; b++) {
                        if (idx + 1 + b < bits.length) {
                            byteVal |= (bits[idx + 1 + b] << b);
                        }
                    }
                    decodedBytes.push(byteVal);
                    idx += 10; // 1 Start + 8 Data + 1 Stop bit
                } else {
                    idx++;
                }
            }

            const decoder = new TextDecoder("utf-8");
            const resultText = decoder.decode(new Uint8Array(decodedBytes));

            outputDiv.innerText = resultText || "No valid data decoded. Check that frequency and baud parameters match the file.";
        }
    </script>
</body>
</html>
